services:
  # ============================================================================
  # Default: Single Unified All-in-One Container
  # Run simply with: docker compose up
  # Bundles FastAPI Engine + Fastify Gateway + Keycloak IAM + SQLite in 1 container
  # ============================================================================
  govsim:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: govsim_all_in_one
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - ACTIVE_MODEL=${ACTIVE_MODEL:-gpt-6-luna}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - KEYCLOAK_GOOGLE_CLIENT_ID=${KEYCLOAK_GOOGLE_CLIENT_ID:-}
      - KEYCLOAK_GOOGLE_CLIENT_SECRET=${KEYCLOAK_GOOGLE_CLIENT_SECRET:-}
      - KEYCLOAK_APPLE_CLIENT_ID=${KEYCLOAK_APPLE_CLIENT_ID:-}
      - KEYCLOAK_APPLE_TEAM_ID=${KEYCLOAK_APPLE_TEAM_ID:-}
      - KEYCLOAK_APPLE_KEY_ID=${KEYCLOAK_APPLE_KEY_ID:-}
      - JWT_SECRET=${JWT_SECRET:-govsim-ai-secret-key-change-in-production}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ============================================================================
  # Optional Split Microservice Topology (for individual container development)
  # Run with: docker compose --profile split up
  # ============================================================================
  fiscal_ai_engine:
    build:
      context: ./fiscal_ai_engine
      dockerfile: Dockerfile
    container_name: govsim_fiscal_ai_engine
    profiles: ["split"]
    ports:
      - "8000:8000"
    environment:
      - ACTIVE_MODEL=${ACTIVE_MODEL:-gpt-6-luna}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - LOG_LEVEL=INFO
    volumes:
      - ./fiscal_ai_engine:/app/fiscal_ai_engine
    command: ["uvicorn", "fiscal_ai_engine.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  gateway_service:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    container_name: govsim_gateway_service
    profiles: ["split"]
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - FISCAL_ENGINE_URL=http://fiscal_ai_engine:8000
      - DB_PATH=/app/data/govsim.sqlite3
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=govsim
    volumes:
      - ./gateway_service/src:/app/src
      - ./gateway_service/public:/app/public
      - ./data:/app/data
    command: ["npm", "run", "dev"]
    depends_on:
      - fiscal_ai_engine

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: govsim_keycloak_standalone
    profiles: ["split"]
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak/govsim-realm.json:/opt/keycloak/data/import/govsim-realm.json:ro
    ports:
      - "8081:8080"
